<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Recommendation Chat</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #222; background: #fff; }
    body { box-sizing: border-box; max-width: 1180px; min-height: 100vh; margin: 0 auto; padding: 1rem; }
    main { display: flex; flex-direction: column; height: calc(100vh - 2rem); min-height: 460px; overflow: hidden; border: 1px solid #aaa; background: #fff; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; padding: .75rem; border-bottom: 1px solid #aaa; }
    h1 { margin: 0; font-size: 1.1rem; font-weight: normal; }
    .settings { display: flex; flex-wrap: wrap; gap: .5rem; align-items: end; }
    label { display: grid; gap: .2rem; font-size: .8rem; }
    select, button, input { font: inherit; }
    select, button { min-height: 2rem; padding: .25rem .4rem; border: 1px solid #888; border-radius: 0; background: #fff; color: inherit; }
    .participant { display: flex; gap: .3rem; align-items: end; }
    .participant label { flex: 1; }
    #participant-status { flex-basis: 100%; min-height: 1em; font-size: .8rem; }
    button { cursor: pointer; }
    button:hover { background: #eee; }
    .workspace { display: flex; flex: 1; min-height: 0; }
    .task-panel { flex: 0 0 31%; overflow-y: auto; padding: .75rem; border-right: 1px solid #aaa; background: #f5f5f5; }
    .task-panel h2 { margin: 0 0 .5rem; font-size: 1rem; font-weight: normal; }
    #task-prompt { white-space: pre-wrap; line-height: 1.4; overflow-wrap: anywhere; }
    .chat-panel { display: flex; flex: 1; min-width: 0; flex-direction: column; }
    #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; padding: .75rem; }
    .message { max-width: 82%; padding: .4rem .6rem; border: 1px solid #ddd; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
    .system { align-self: flex-start; background: #f5f5f5; }
    .user { align-self: flex-end; background: #fff; }
    .error { align-self: center; color: #900; background: #fff; }
    form { display: flex; gap: .5rem; padding: .75rem; border-top: 1px solid #aaa; }
    input { min-width: 0; flex: 1; padding: .4rem; border: 1px solid #888; border-radius: 0; }
    #send:disabled { opacity: .6; cursor: wait; }
    @media (max-width: 760px) {
      body { padding: .5rem; }
      main { height: calc(100vh - 1rem); }
      header { padding: .75rem; }
      .workspace { flex-direction: column; }
      .task-panel { flex: 0 0 auto; max-height: 30%; border-right: 0; border-bottom: 1px solid #e7ecef; }
      .message { max-width: 92%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Restaurant Recommendation Chat</h1>
      <div class="settings">
        <label>Dialog model
          <select id="model">
            {% for model in models %}
            <option value="{{ model }}" {% if model == selected_model %}selected{% endif %}>{{ model }}</option>
            {% endfor %}
          </select>
        </label>
        <label>Slot matching
          <select id="match-type">
            {% for kind in match_types %}
            <option value="{{ kind.value }}" {% if kind == selected_match_type %}selected{% endif %}>{{ kind.value.replace('_', ' ') }}</option>
            {% endfor %}
          </select>
        </label>
        <label>Configuration
          <select id="config">
            {% for option in configs %}
            <option value="{{ option.value }}" {% if option.value == selected_config %}selected{% endif %}>{{ option.label }}</option>
            {% endfor %}
          </select>
        </label>
        <div class="participant">
          <label>Participant code
            <input id="participant-code" maxlength="100" value="{{ participant_code }}" placeholder="Enter code" {% if participant_code %}readonly{% endif %}>
          </label>
          <button id="save-participant" type="button" {% if participant_code %}hidden{% endif %}>Save code</button>
        </div>
        <button id="reset" type="button">New conversation</button>
        <span id="participant-status" role="status">{% if participant_code %}Participant code saved{% else %}Save your participant code before chatting{% endif %}</span>
      </div>
    </header>
    <div class="workspace">
      <aside class="task-panel" aria-labelledby="task-heading">
        <h2 id="task-heading">Your task</h2>
        <div id="task-prompt"></div>
      </aside>
      <section class="chat-panel" aria-label="Chat">
        <section id="messages" aria-live="polite" aria-label="Conversation"></section>
        <form id="chat-form">
          <input id="message" name="message" autocomplete="off" maxlength="1000" placeholder="Tell me what kind of restaurant you want…" required>
          <button id="send" type="submit">Send</button>
        </form>
      </section>
    </div>
  </main>
  <script>
    const messages = document.querySelector("#messages");
    const input = document.querySelector("#message");
    const sendButton = document.querySelector("#send");
    const modelSelect = document.querySelector("#model");
    const matchTypeSelect = document.querySelector("#match-type");
    const configSelect = document.querySelector("#config");
    const participantCodeInput = document.querySelector("#participant-code");
    const saveParticipantButton = document.querySelector("#save-participant");
    const participantStatus = document.querySelector("#participant-status");
    const taskPrompt = document.querySelector("#task-prompt");
    let settingsUpdate = Promise.resolve();

    function renderTaskPrompt(text) {
      taskPrompt.replaceChildren();
      const parents = [taskPrompt];
      const boldTag = /<\/?b>/g;
      let lastIndex = 0;
      let match;

      while ((match = boldTag.exec(text)) !== null) {
        const currentParent = parents[parents.length - 1];
        currentParent.append(document.createTextNode(text.slice(lastIndex, match.index)));
        if (match[0] === "<b>") {
          const bold = document.createElement("b");
          currentParent.append(bold);
          parents.push(bold);
        } else if (parents.length > 1) {
          parents.pop();
        } else {
          currentParent.append(document.createTextNode(match[0]));
        }
        lastIndex = boldTag.lastIndex;
      }

      parents[parents.length - 1].append(document.createTextNode(text.slice(lastIndex)));
    }

    function addMessage(text, kind = "system") {
      const message = document.createElement("div");
      message.className = `message ${kind}`;
      message.textContent = text;
      messages.append(message);
      messages.scrollTop = messages.scrollHeight;
      return message;
    }

    function wordDelay() {
      const first = Math.random() || Number.EPSILON;
      const second = Math.random();
      const normalSample = Math.sqrt(-2 * Math.log(first)) * Math.cos(2 * Math.PI * second);
      return Math.max(100, 150 + normalSample * 150);
    }

    function wait(milliseconds) {
      return new Promise((resolve) => setTimeout(resolve, milliseconds));
    }

    async function showSystemResponse(text, style) {
      if (style === "normal") {
        addMessage(text);
        return;
      }

      const parts = text.match(/\S+\s*/g) || [text];
      if (style === "delay") {
        const totalDelay = parts.reduce((delay) => delay + wordDelay(), 0);
        await wait(totalDelay);
        addMessage(text);
        return;
      }

      const message = addMessage("");
      for (const part of parts) {
        await wait(wordDelay());
        message.textContent += part;
        messages.scrollTop = messages.scrollHeight;
      }
    }

    async function postJson(url, payload = {}) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || "The request failed.");
      return result;
    }

    document.querySelector("#chat-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      sendButton.disabled = true;
      try {
        await settingsUpdate;
        const result = await postJson("/api/message", { message });
        await showSystemResponse(result.response, result.print_style);
      } catch (error) {
        addMessage(error.message, "error");
      } finally {
        sendButton.disabled = !participantCodeInput.readOnly;
        input.focus();
      }
    });

    async function saveSettings() {
      const settings = {
        model: modelSelect.value,
        match_type: matchTypeSelect.value,
        config: configSelect.value
      };
      settingsUpdate = settingsUpdate.then(async () => {
        const result = await postJson("/api/settings", settings);
        if (result.task_value) renderTaskPrompt(result.task_value);
      }).catch((error) => addMessage(error.message, "error"));
      return settingsUpdate;
    }

    modelSelect.addEventListener("change", saveSettings);
    matchTypeSelect.addEventListener("change", saveSettings);
    configSelect.addEventListener("change", saveSettings);
    saveParticipantButton.addEventListener("click", async () => {
      saveParticipantButton.disabled = true;
      try {
        const result = await postJson("/api/participant", {
          participant_code: participantCodeInput.value
        });
        participantCodeInput.value = result.participant_code;
        participantCodeInput.readOnly = true;
        saveParticipantButton.hidden = true;
        participantStatus.textContent = "Participant code saved";
        sendButton.disabled = false;
      } catch (error) {
        participantStatus.textContent = error.message;
        saveParticipantButton.disabled = false;
      }
    });
    document.querySelector("#reset").addEventListener("click", async () => {
      try {
        const result = await postJson("/api/reset");
        messages.replaceChildren();
        addMessage(result.greeting);
        renderTaskPrompt(result.task_value);
      } catch (error) {
        addMessage(error.message, "error");
      }
      input.focus();
    });

    renderTaskPrompt({{ task_value|tojson }});
    addMessage({{ greeting|tojson }});
    sendButton.disabled = !participantCodeInput.readOnly;
    input.focus();
  </script>
</body>
</html>
