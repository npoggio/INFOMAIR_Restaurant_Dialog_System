<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Recommendation Chat</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #202a35; background: #f3f6f8; }
    body { box-sizing: border-box; max-width: 780px; min-height: 100vh; margin: 0 auto; padding: 2rem 1rem; }
    main { display: flex; flex-direction: column; height: min(820px, calc(100vh - 4rem)); min-height: 460px; overflow: hidden; border: 1px solid #dce3e8; border-radius: 16px; background: white; box-shadow: 0 12px 36px #23384b12; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.2rem 1.4rem; border-bottom: 1px solid #e7ecef; }
    h1 { margin: 0; font-size: 1.2rem; }
    .settings { display: flex; flex-wrap: wrap; gap: .65rem; align-items: end; }
    label { display: grid; gap: .25rem; font-size: .75rem; color: #53616d; }
    select, button, input { font: inherit; }
    select, button { min-height: 2.5rem; padding: .45rem .7rem; border: 1px solid #cbd5dc; border-radius: 8px; background: white; color: inherit; }
    button { cursor: pointer; }
    button:hover { background: #f1f6f8; }
    #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .85rem; padding: 1.2rem; }
    .message { max-width: 82%; padding: .75rem 1rem; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
    .system { align-self: flex-start; background: #edf3f6; }
    .user { align-self: flex-end; background: #176b5b; color: white; }
    .error { align-self: center; color: #a12622; background: #fff0ef; }
    form { display: flex; gap: .65rem; padding: 1rem 1.2rem; border-top: 1px solid #e7ecef; }
    input { min-width: 0; flex: 1; padding: .7rem .85rem; border: 1px solid #cbd5dc; border-radius: 8px; }
    #send { border-color: #176b5b; background: #176b5b; color: white; }
    #send:disabled { opacity: .6; cursor: wait; }
    @media (max-width: 540px) { body { padding: .5rem; } main { height: calc(100vh - 1rem); } header { padding: 1rem; } .message { max-width: 92%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Restaurant Recommendation Chat</h1>
      <div class="settings">
        <label>Dialog model
          <select id="model">
            {% for model in models %}
            <option value="{{ model }}" {% if model == selected_model %}selected{% endif %}>{{ model }}</option>
            {% endfor %}
          </select>
        </label>
        <label>Slot matching
          <select id="match-type">
            {% for kind in match_types %}
            <option value="{{ kind.value }}" {% if kind == selected_match_type %}selected{% endif %}>{{ kind.value.replace('_', ' ') }}</option>
            {% endfor %}
          </select>
        </label>
        <label>System output
          <select id="print-style">
            <option value="normal">Normal</option>
            <option value="delay">Delayed</option>
            <option value="stream">Stream</option>
          </select>
        </label>
        <button id="reset" type="button">New conversation</button>
      </div>
    </header>
    <section id="messages" aria-live="polite" aria-label="Conversation"></section>
    <form id="chat-form">
      <input id="message" name="message" autocomplete="off" maxlength="1000" placeholder="Tell me what kind of restaurant you want…" required>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <script>
    const messages = document.querySelector("#messages");
    const input = document.querySelector("#message");
    const sendButton = document.querySelector("#send");
    const modelSelect = document.querySelector("#model");
    const matchTypeSelect = document.querySelector("#match-type");
    const printStyleSelect = document.querySelector("#print-style");

    function addMessage(text, kind = "system") {
      const message = document.createElement("div");
      message.className = `message ${kind}`;
      message.textContent = text;
      messages.append(message);
      messages.scrollTop = messages.scrollHeight;
      return message;
    }

    function wordDelay() {
      const first = Math.random() || Number.EPSILON;
      const second = Math.random();
      const normalSample = Math.sqrt(-2 * Math.log(first)) * Math.cos(2 * Math.PI * second);
      return Math.max(100, 150 + normalSample * 150);
    }

    function wait(milliseconds) {
      return new Promise((resolve) => setTimeout(resolve, milliseconds));
    }

    async function showSystemResponse(text, style) {
      if (style === "normal") {
        addMessage(text);
        return;
      }

      const parts = text.match(/\S+\s*/g) || [text];
      if (style === "delay") {
        const totalDelay = parts.reduce((delay) => delay + wordDelay(), 0);
        await wait(totalDelay);
        addMessage(text);
        return;
      }

      const message = addMessage("");
      for (const part of parts) {
        await wait(wordDelay());
        message.textContent += part;
        messages.scrollTop = messages.scrollHeight;
      }
    }

    async function postJson(url, payload = {}) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || "The request failed.");
      return result;
    }

    document.querySelector("#chat-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      sendButton.disabled = true;
      const printStyle = printStyleSelect.value;
      try {
        const result = await postJson("/api/message", { message });
        await showSystemResponse(result.response, printStyle);
      } catch (error) {
        addMessage(error.message, "error");
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    });

    async function saveSettings() {
      try {
        await postJson("/api/settings", {
          model: modelSelect.value,
          match_type: matchTypeSelect.value
        });
      } catch (error) {
        addMessage(error.message, "error");
      }
    }

    modelSelect.addEventListener("change", saveSettings);
    matchTypeSelect.addEventListener("change", saveSettings);
    document.querySelector("#reset").addEventListener("click", async () => {
      try {
        const result = await postJson("/api/reset");
        messages.replaceChildren();
        addMessage(result.greeting);
      } catch (error) {
        addMessage(error.message, "error");
      }
      input.focus();
    });

    addMessage({{ greeting|tojson }});
    input.focus();
  </script>
</body>
</html>
